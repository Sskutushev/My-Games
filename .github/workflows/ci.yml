name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Линт и формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff format --check
        run: ruff format --check --diff .
      - name: ruff check
        run: ruff check --output-format=github .

  typecheck:
    name: Типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy

  test:
    name: Тесты (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -m "not gamedata" --cov=dl_toolkit --cov-report=xml --cov-report=term
      - name: Выгрузить отчёт покрытия
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  migrations:
    name: Миграции данных
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Свод правил валиден на текущей схеме
        run: dl rules data/obsidian_gate/ruleset.yaml
      - name: Миграций не требуется (файл в актуальной версии)
        run: |
          output=$(dl migrate data/obsidian_gate/ruleset.yaml)
          echo "$output"
          echo "$output" | grep -q "не требуются"
      - name: Сгенерированные данные совпадают с закоммиченными
        run: |
          python tools/generate_ruleset.py
          git diff --exit-code -- data/obsidian_gate/ruleset.yaml \
            || { echo "::error::data/obsidian_gate/ruleset.yaml устарел; перегенерируйте и закоммитьте"; exit 1; }

  build:
    name: Сборка пакета
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build twine
      - name: build
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: Установить из wheel и проверить точку входа
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/dl version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
